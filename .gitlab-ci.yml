stages:
  - validate
  - deploy

# Board data is transcribed by hand from reference images and the sprite art is
# hand-edited character grids, so the likely breakage is data-shaped and silent:
# a picture row that lost a character, a conveyor pointing into a wall, a laser
# with nothing to mount on. None of those throw on their own -- they render a
# board that is plausible and wrong, which is the one failure a game promising
# faithful maps cannot survive. Catch it before it reaches the site.
#
# check-no-photos.js runs FIRST, and runs against the fresh clone CI just made
# -- which is exactly what the public gets. maps/, manual*/ and rules/ hold
# photographs of someone else's printed board art, this repo is public, and
# they were public once already before anyone noticed. A .gitignore line was
# all that stood there, and it has a hole: a pattern ending in a slash does not
# match a symlink, which is how a worktree links an 800MB directory.
#
# check-rules.js also fails when no simulated game is ever WON. A sim that only
# reports "no crashes" cannot tell a working engine from one where the win
# condition is unreachable, and that distinction has already mattered once here.
validate:
  stage: validate
  image: node:20-alpine
  # The alpine image has no git, and two checks below shell out to it:
  # check-no-photos (git ls-files against the fresh clone) and check-imports
  # (git check-ignore, so a file a fresh clone would not have is refused).
  # Without git the first reported "not a git checkout, nothing to check" and
  # PASSED, and the second crashed, which is how every pipeline after
  # 2026-09-14 went red while the checks themselves were green locally.
  before_script:
    - apk add --no-cache git
    - git --version
  script:
    - node tools/check-no-photos.js
    - node tools/check-assets.js
    - node tools/check-ship.js
    - test -s index.html
    - grep -q 'data-pumarally-game' index.html

    # The board workshop and the PRBoard v1 format under editor/. Ordered so
    # the thing that would make the others meaningless runs first: the format
    # library, then the validator's own self-test, then the checks that lean on
    # both.
    - node editor/tools/check-imports.js
    - node editor/tools/check-lib.js
    - node editor/tools/check-app.js
    - node editor/tools/validator-selftest.js
    - node editor/tools/make-fixtures.js --check
    - node editor/tools/check-format.js
    - node editor/tools/render-snapshot.js --check
    - node editor/tools/check-wiring.js
    - node editor/tools/build-index.js --check
    - node editor/tools/check-editor-assets.js

    # The game under game/, built on the workshop's data and library. Its
    # tables are lifted from the old game and its scenarios are the old
    # suite's names; the run prints how many are still pending. sim.js seats
    # bots and randomly-answered humans on every course and fails if any game
    # crashes, a conservation law breaks, or no game is ever won.
    - node game/tools/check-all.js
    - node game/tools/sim.js 20

deploy:
  stage: deploy
  image: debian:bookworm-slim
  only:
    - main
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync > /dev/null 2>&1
    - mkdir -p ~/.ssh
    - cp "$DREAMHOST_SSH_KEY" ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Host key is PINNED rather than scanned. A bare `ssh-keyscan` opens a burst
    # of parallel connections (one per host-key type), which trips an SSH-scan
    # detector on the self-hosted runner's network path; outbound port 22 to the
    # target is then blackholed for ~3 minutes -- long enough for the rsync below
    # to time out, which is what makes the job die with exit 255 after 133s.
    # Pinning costs zero connections and is also strictly safer than trusting
    # whatever key happens to answer at deploy time.
    # If DreamHost rebuilds the VPS this must be re-pinned: the job will then
    # fail loudly on a host key mismatch rather than silently trust a new key.
    - echo "$DREAMHOST_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEtxw582rJAeTpXMTRJeGJ6GHis19hHmWWBwEL1bCbYd" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # ConnectTimeout turns a blocked port into a 15s failure instead of a 133s
    # one. It lives in ssh_config rather than on each command line so that
    # rsync's own ssh picks it up too, without touching any rsync invocation.
    - printf 'Host *\n  ConnectTimeout 15\n  BatchMode yes\n' > ~/.ssh/config
    - chmod 600 ~/.ssh/config
    # Outbound port 22 to this host gets blackholed for minutes once too many
    # SSH connections go to it in a short window -- a mass deploy trips it even
    # with no ssh-keyscan anywhere. Retry with long gaps so a queued deploy rides
    # the block out instead of going red. The gaps are deliberately long: probing
    # harder re-arms the block rather than clearing it.
    - |
      puma_rsync() {
        attempt=1
        until rsync "$@"; do
          if [ "$attempt" -ge 3 ]; then
            echo "rsync failed after $attempt attempts" >&2
            return 1
          fi
          echo "attempt $attempt failed; waiting 200s for any port-22 block to clear"
          attempt=$((attempt + 1))
          sleep 200
        done
      }
  script:
    # Single destination, so this job costs exactly one SSH connection.
    #
    # --delete-excluded is load-bearing, and the reason is a trap worth
    # naming: plain --delete does NOT delete paths matched by --exclude.
    # Excluded paths are PROTECTED on the destination. So adding
    # --exclude='maps' to stop publishing board photographs had the exact
    # opposite effect on the ones already up there -- it pinned them in
    # place, and a deploy that looked like a cleanup changed nothing.
    # With --delete-excluded, anything excluded here is also removed from
    # the live site, which is what "do not publish this" has to mean.
    #
    # PRODUCT.md, DESIGN.md, .impeccable/ and .impeccable.md are design notes
    # the impeccable skill writes into the repo root (games-meta STANDARD.md
    # §12). They stay in the repo and off the live site.
    - puma_rsync -avz --delete --delete-excluded --exclude='.git' --exclude='.claude' --exclude='PRODUCT.md' --exclude='DESIGN.md' --exclude='.impeccable' --exclude='.impeccable.md' --exclude='.gitlab-ci.yml' --exclude='tools' --exclude='maps' --exclude='manual*' --exclude='rules' ./ ${DREAMHOST_USERNAME}@${DREAMHOST_HOST}:/home/${DREAMHOST_USERNAME}/greykit.com/games/pumarally/
  # environment: lets GitLab's "Prevent outdated deployment jobs" act on this
  # job, so a deploy from an older pipeline that starts after a newer one has
  # deployed fails instead of republishing stale files. resource_group: runs
  # deploys one at a time, so an older one still running when a newer one
  # starts cannot finish last. Together, the last merge is the one left live.
  environment:
    name: production
    url: https://greykit.com/games/pumarally/
  resource_group: production
